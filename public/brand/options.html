<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Loam logo options</title>
<style>
body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:#fff;color:#111;padding:40px}
h1{font-size:22px;margin:0 0 24px}.row{display:flex;gap:28px;flex-wrap:wrap}
.card{border:1px solid rgb(230,232,236);border-radius:12px;padding:24px;width:300px}
.big{width:96px;height:96px}.lock{display:flex;align-items:center;gap:10px;margin-top:20px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.lock img{width:28px;height:28px}.dark{background:#0f1012;color:#eee;margin-top:16px;padding:12px;border-radius:8px}
.name{font-weight:600;margin-top:14px}.faint{color:#6b7280;font-size:13px}
</style></head><body><h1>Loam logo options</h1><div class="row">
<div class="card"><img class="big" src="strata.svg" alt=""><div class="name">1. Strata</div><div class="faint">Layers of soil, and rows in a table getting richer. Blue, Clay-style.</div><div class="lock"><img src="strata.svg" alt="">Loam</div><div class="lock dark"><img src="strata.svg" alt="">Loam</div></div>
<div class="card"><img class="big" src="sprout.svg" alt=""><div class="name">2. Sprout</div><div class="faint">Something growing out of the ground: a list turning into leads.</div><div class="lock"><img src="sprout.svg" alt="">Loam</div><div class="lock dark"><img src="sprout.svg" alt="">Loam</div></div>
<div class="card"><img class="big" src="grid-l.svg" alt=""><div class="name">3. Grid L</div><div class="faint">Table cells forming an L. Closest to your black-and-white brand.</div><div class="lock"><img src="grid-l.svg" alt="">Loam</div><div class="lock dark"><img src="grid-l.svg" alt="">Loam</div></div>
</div></body></html>
